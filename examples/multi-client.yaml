# Server + two clients (client2 with PSK). FORWARD rules enable client-to-client routing.
# Generate keys: docker run --rm ivenos/compwire:latest genkey
# Generate PSK:  docker run --rm ivenos/compwire:latest genpsk
# .env: WG_SERVER_PRIV/PUB, WG_CLIENT1_PRIV/PUB, WG_CLIENT2_PRIV/PUB, WG_PSK, WG_SERVER_HOST
#       COMPWIRE_IMAGE overrides the image, e.g. for a locally built one.
# Usage: one service per host, e.g. on the server
#   docker compose --env-file .env -f examples/multi-client.yaml up server
#        (without --env-file, Compose looks for .env next to this file)
#
# Unlike the other examples this one cannot run in full on a single host: with
# network_mode: host both clients would install a route for the server address
# 10.77.0.1 in the same namespace, and the second one loses to "File exists".
#
# Client-to-client traffic also needs IP forwarding on the host:
#   sysctl -w net.ipv4.ip_forward=1

services:
  server:
    image: ${COMPWIRE_IMAGE:-ivenos/compwire:latest}
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    environment:
      WG_ROLE: server
      WG_PRIVATE_KEY: ${WG_SERVER_PRIV}
      WG_ADDRESS: 10.77.0.1/24
      # %i expands to the interface name, so these keep working if WG_IFACE changes.
      WG_POST_UP: "iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT"
      WG_POST_DOWN: "iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT"
      WG_PEER_CLIENT1_PUBKEY: ${WG_CLIENT1_PUB}
      WG_PEER_CLIENT1_ALLOWED_IPS: 10.77.0.2/32
      WG_PEER_CLIENT2_PUBKEY: ${WG_CLIENT2_PUB}
      WG_PEER_CLIENT2_ALLOWED_IPS: 10.77.0.3/32
      WG_PEER_CLIENT2_PSK: ${WG_PSK}
    restart: unless-stopped

  client1:
    image: ${COMPWIRE_IMAGE:-ivenos/compwire:latest}
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    depends_on:
      server:
        condition: service_healthy
    environment:
      WG_ROLE: client
      WG_IFACE: wg1
      WG_PRIVATE_KEY: ${WG_CLIENT1_PRIV}
      # Each client needs its own address, matching its WG_PEER_*_ALLOWED_IPS on
      # the server. Without it both clients default to 10.77.0.2/24 and the
      # server silently drops everything from the second one.
      WG_ADDRESS: 10.77.0.2/32
      WG_SERVER_PUBKEY: ${WG_SERVER_PUB}
      WG_SERVER_ENDPOINT: ${WG_SERVER_HOST:-127.0.0.1}:51820
      WG_ALLOWED_IPS: 10.77.0.0/24
    restart: unless-stopped

  client2:
    image: ${COMPWIRE_IMAGE:-ivenos/compwire:latest}
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    depends_on:
      server:
        condition: service_healthy
    environment:
      WG_ROLE: client
      WG_IFACE: wg2
      WG_PRIVATE_KEY: ${WG_CLIENT2_PRIV}
      WG_ADDRESS: 10.77.0.3/32
      WG_SERVER_PUBKEY: ${WG_SERVER_PUB}
      WG_SERVER_ENDPOINT: ${WG_SERVER_HOST:-127.0.0.1}:51820
      WG_ALLOWED_IPS: 10.77.0.0/24
      WG_PSK: ${WG_PSK}
    restart: unless-stopped
