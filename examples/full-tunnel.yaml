# Full-tunnel: all client IPv4 traffic routed via the server, masqueraded to its
# outbound IP. The server here is IPv4-only, so IPv6 stays on the local link.
# Find the outbound interface:  ip route | awk '/default/{print $5; exit}'
# .env: WG_SERVER_PRIV, WG_SERVER_PUB, WG_CLIENT_PRIV, WG_CLIENT_PUB, WG_SERVER_HOST, WG_OUTBOUND_IFACE
#       COMPWIRE_IMAGE overrides the image, e.g. for a locally built one.
# Usage: one service per host, the client with --no-deps
#   docker compose --env-file .env -f examples/full-tunnel.yaml up server
#   docker compose --env-file .env -f examples/full-tunnel.yaml up --no-deps client
#
# The client takes over the default route of its host, including the connection
# you started it from. Two host sysctls are required, neither settable from a
# container: net.ipv4.ip_forward=1 and net.ipv4.conf.all.src_valid_mark=1.

name: compwire-full-tunnel

services:
  server:
    image: ${COMPWIRE_IMAGE:-ivenos/compwire:latest}
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    environment:
      WG_ROLE: server
      WG_PRIVATE_KEY: ${WG_SERVER_PRIV}
      WG_ADDRESS: 10.77.0.1/24
      # The masquerade rule goes first: a failed PostUp skips PostDown, so
      # whatever ran before it stays on the host. The placeholder is too long for
      # an interface name, which is what makes iptables refuse it by name.
      WG_POST_UP: "iptables -t nat -A POSTROUTING -o ${WG_OUTBOUND_IFACE:-SET_WG_OUTBOUND_IFACE} -j MASQUERADE; iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT"
      WG_POST_DOWN: "iptables -t nat -D POSTROUTING -o ${WG_OUTBOUND_IFACE:-SET_WG_OUTBOUND_IFACE} -j MASQUERADE; iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT"
      WG_PEER_CLIENT_PUBKEY: ${WG_CLIENT_PUB}
      WG_PEER_CLIENT_ALLOWED_IPS: 10.77.0.2/32
    restart: unless-stopped

  client:
    image: ${COMPWIRE_IMAGE:-ivenos/compwire:latest}
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    depends_on:
      server:
        condition: service_healthy
    environment:
      WG_ROLE: client
      WG_IFACE: wg1
      WG_PRIVATE_KEY: ${WG_CLIENT_PRIV}
      WG_ADDRESS: 10.77.0.2/32
      WG_SERVER_PUBKEY: ${WG_SERVER_PUB}
      WG_SERVER_ENDPOINT: ${WG_SERVER_HOST:-SET_WG_SERVER_HOST}:51820
      # IPv4 only: the server above has no IPv6 address and no ip6tables rule, so
      # ::/0 here would send IPv6 into a tunnel that drops it.
      WG_ALLOWED_IPS: 0.0.0.0/0
      # No WG_DNS: it only reaches the container's own /etc/resolv.conf.
    restart: unless-stopped
