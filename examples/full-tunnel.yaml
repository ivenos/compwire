# Full-tunnel: all client IPv4 traffic routed via the server, masqueraded to its
# outbound IP. The server here is IPv4-only, so IPv6 stays on the local link.
# Find the outbound interface:  ip route | awk '/default/{print $5; exit}'
# .env: WG_SERVER_PRIV, WG_SERVER_PUB, WG_CLIENT_PRIV, WG_CLIENT_PUB, WG_SERVER_HOST, WG_OUTBOUND_IFACE
#       COMPWIRE_IMAGE overrides the image, e.g. for a locally built one.
# Usage: docker compose --env-file .env -f examples/full-tunnel.yaml up
#        (without --env-file, Compose looks for .env next to this file)
#
# Two host settings are required, neither of which a container can set for itself:
#   sysctl -w net.ipv4.ip_forward=1                    # server forwards client traffic
#   sysctl -w net.ipv4.conf.all.src_valid_mark=1       # wg-quick sets this for a
#     0.0.0.0/0 route, but /proc/sys is read-only in the container and the write
#     aborts wg-quick. Set it on the host and wg-quick skips it.

services:
  server:
    image: ${COMPWIRE_IMAGE:-ivenos/compwire:latest}
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    environment:
      WG_ROLE: server
      WG_PRIVATE_KEY: ${WG_SERVER_PRIV}
      WG_ADDRESS: 10.77.0.1/24
      # %i expands to the interface name. WG_OUTBOUND_IFACE has no default on
      # purpose: a wrong name installs a rule that never matches, and the tunnel
      # then comes up healthy with no internet access.
      # Both directions: with a FORWARD policy of DROP the return traffic would
      # otherwise be dropped and the tunnel would look healthy without internet.
      WG_POST_UP: "iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o ${WG_OUTBOUND_IFACE:?set WG_OUTBOUND_IFACE to the host's outbound interface} -j MASQUERADE"
      WG_POST_DOWN: "iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o ${WG_OUTBOUND_IFACE:?set WG_OUTBOUND_IFACE to the host's outbound interface} -j MASQUERADE"
      WG_PEER_CLIENT_PUBKEY: ${WG_CLIENT_PUB}
      WG_PEER_CLIENT_ALLOWED_IPS: 10.77.0.2/32
    restart: unless-stopped

  client:
    image: ${COMPWIRE_IMAGE:-ivenos/compwire:latest}
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    depends_on:
      server:
        condition: service_healthy
    environment:
      WG_ROLE: client
      WG_IFACE: wg1
      WG_PRIVATE_KEY: ${WG_CLIENT_PRIV}
      WG_ADDRESS: 10.77.0.2/32
      WG_SERVER_PUBKEY: ${WG_SERVER_PUB}
      WG_SERVER_ENDPOINT: ${WG_SERVER_HOST:?set WG_SERVER_HOST to the server's public IP or hostname}:51820
      # IPv4 only: the server above has no IPv6 address and no ip6tables rule, so
      # ::/0 here would send IPv6 into a tunnel that drops it.
      WG_ALLOWED_IPS: 0.0.0.0/0
      WG_DNS: 1.1.1.1
    restart: unless-stopped
