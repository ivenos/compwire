# Keys from files instead of the environment.
#
# Anything passed as an environment variable stays visible in `docker inspect`
# and in /proc/<pid>/environ for the life of the container. The *_FILE variants
# read the value from a mounted file instead, so the key never enters the
# container's environment.
#
# Prepare the files (mode 600, not inside the repo):
#   docker run --rm ivenos/compwire:latest genkey > /dev/null   # see README
#   printf '%s' '<server-private-key>' > ../secrets/server.key
#   printf '%s' '<client-private-key>' > ../secrets/client.key
#   docker run --rm ivenos/compwire:latest genpsk > ../secrets/tunnel.psk
#   chmod 600 ../secrets/*
#
# .env: WG_CLIENT_PUB, WG_SERVER_PUB, WG_SERVER_HOST
# Usage: docker compose --env-file .env -f examples/secrets.yaml up

secrets:
  server_key:
    file: ../secrets/server.key
  client_key:
    file: ../secrets/client.key
  tunnel_psk:
    file: ../secrets/tunnel.psk

services:
  server:
    image: ${COMPWIRE_IMAGE:-ivenos/compwire:latest}
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    secrets: [server_key, tunnel_psk]
    environment:
      WG_ROLE: server
      WG_PRIVATE_KEY_FILE: /run/secrets/server_key
      WG_ADDRESS: 10.77.0.1/24
      WG_PEER_CLIENT_PUBKEY: ${WG_CLIENT_PUB}
      WG_PEER_CLIENT_ALLOWED_IPS: 10.77.0.2/32
      WG_PEER_CLIENT_PSK_FILE: /run/secrets/tunnel_psk
    restart: unless-stopped

  client:
    image: ${COMPWIRE_IMAGE:-ivenos/compwire:latest}
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    secrets: [client_key, tunnel_psk]
    depends_on:
      server:
        condition: service_healthy
    environment:
      WG_ROLE: client
      WG_IFACE: wg1
      WG_PRIVATE_KEY_FILE: /run/secrets/client_key
      WG_ADDRESS: 10.77.0.2/32
      WG_SERVER_PUBKEY: ${WG_SERVER_PUB}
      WG_SERVER_ENDPOINT: ${WG_SERVER_HOST:-127.0.0.1}:51820
      WG_PSK_FILE: /run/secrets/tunnel_psk
    restart: unless-stopped
