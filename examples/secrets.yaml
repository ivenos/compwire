# Keys from files instead of the environment, so they stay out of
# `docker inspect` and /proc/<pid>/environ.
#
# Prepare the files. The file: paths below resolve relative to this file:
#   mkdir -p secrets && chmod 700 secrets
#   docker run --rm ivenos/compwire:latest genkey    # once per node
#   printf '%s' '<server-private-key>' > secrets/server.key
#   printf '%s' '<client-private-key>' > secrets/client.key
#   docker run --rm ivenos/compwire:latest genpsk > secrets/tunnel.psk
#   chmod 644 secrets/*
#   chcon -t container_file_t secrets/*   # SELinux hosts only
#
# 644, not 600: cap_drop ALL takes CAP_DAC_OVERRIDE from root, so the container
# reaches these only through the world bits. The 700 on the directory is what
# keeps other users out. Alternatively chown them to uid 0 and keep 600.
#
# .env: WG_CLIENT_PUB, WG_SERVER_PUB, WG_SERVER_HOST
#       COMPWIRE_IMAGE overrides the image, e.g. for a locally built one.
# Usage: docker compose --env-file .env -f examples/secrets.yaml up
#        Both on one host demonstrates the handshake, not the tunnel.

name: compwire-secrets

secrets:
  server_key:
    file: ../secrets/server.key
  client_key:
    file: ../secrets/client.key
  tunnel_psk:
    file: ../secrets/tunnel.psk

services:
  server:
    image: ${COMPWIRE_IMAGE:-ivenos/compwire:latest}
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    secrets: [server_key, tunnel_psk]
    environment:
      WG_ROLE: server
      WG_PRIVATE_KEY_FILE: /run/secrets/server_key
      WG_ADDRESS: 10.77.0.1/24
      WG_PEER_CLIENT_PUBKEY: ${WG_CLIENT_PUB}
      WG_PEER_CLIENT_ALLOWED_IPS: 10.77.0.2/32
      WG_PEER_CLIENT_PSK_FILE: /run/secrets/tunnel_psk
    restart: unless-stopped

  client:
    image: ${COMPWIRE_IMAGE:-ivenos/compwire:latest}
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    secrets: [client_key, tunnel_psk]
    depends_on:
      server:
        condition: service_healthy
    environment:
      WG_ROLE: client
      WG_IFACE: wg1
      WG_PRIVATE_KEY_FILE: /run/secrets/client_key
      WG_ADDRESS: 10.77.0.2/32
      WG_SERVER_PUBKEY: ${WG_SERVER_PUB}
      WG_SERVER_ENDPOINT: ${WG_SERVER_HOST:-127.0.0.1}:51820
      WG_PSK_FILE: /run/secrets/tunnel_psk
    restart: unless-stopped
