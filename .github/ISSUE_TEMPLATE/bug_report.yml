name: Bug Report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in as much detail as possible. Attach container logs (`docker compose logs`) when relevant.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant container output (`docker compose logs`).
      render: text

  - type: input
    id: version
    attributes:
      label: compwire image tag
      placeholder: "e.g. latest, dev, 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Role
      options:
        - server
        - client
        - both
    validations:
      required: true

  - type: textarea
    id: host
    attributes:
      label: Host
      description: >
        The four things that explain most reports: kernel and distribution
        (`uname -sr`), architecture (`uname -m`), whether the modules are loaded
        (`lsmod | grep -E 'wireguard|nft_compat'`) and whether SELinux or
        AppArmor is enforcing.
      render: text
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network mode
      options:
        - "network_mode: host"
        - bridge with a published port
        - other
    validations:
      required: true
