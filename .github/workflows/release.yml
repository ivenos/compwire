name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The new version, such as 1.5.0
        required: true
        type: string
  push:
    branches: [main]
    paths: [Dockerfile]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      name: ${{ steps.stamp.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_type == 'branch' && 'main' || '' }}

      - name: Stamp the changelog and tag the commit
        id: stamp
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::A release is started from main"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            unreleased=$(awk '/^## \[Unreleased\]/ { on = 1; next } on && /^(## \[|\[[^]]+\]: )/ { exit } on && NF' CHANGELOG.md)
            if ! grep -q '^- alpine ' <<< "$unreleased" || grep -qvxE -e '### Dependencies' -e '- [^ ]+ [^ ]+ -> [^ ]+( \(#[0-9, #]+\))?' <<< "$unreleased"; then
              echo "Unreleased has no Alpine update or lists more than dependencies, so it waits for the next release."
              exit 0
            fi
            last=$(awk -F '[][]' '/^## \[[0-9]+\.[0-9]+\.[0-9]+\]/ { print $2; exit }' CHANGELOG.md)
            VERSION="${last%.*}.$(( ${last##*.} + 1 ))"
          fi
          sh .github/scripts/changelog.sh release "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release $VERSION" CHANGELOG.md
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
          echo "name=v$VERSION" >> "$GITHUB_OUTPUT"

  image:
    needs: tag
    if: needs.tag.outputs.name != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-publish.yml
    with:
      tag: ${{ needs.tag.outputs.name }}
    secrets: inherit

  release:
    needs: [tag, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.name }}

      - name: Write the release notes
        env:
          NAME: ${{ needs.tag.outputs.name }}
        run: sh .github/scripts/changelog.sh notes "${NAME#v}" > "$RUNNER_TEMP/notes.md"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.name }}
          body_path: ${{ runner.temp }}/notes.md
          draft: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
