name: Build & Publish

on:
  push:
    branches: [main]
    # v[0-9]* rather than v*: a non-semver tag would build an image that the
    # tag rules below cannot name.
    tags: ["v[0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GITHUB_IMAGE: ghcr.io/ivenos/compwire
  DOCKERHUB_IMAGE: ivenos/compwire

# One run per ref: PRs cancel superseded runs, pushes to the same ref queue. A main
# push and a tag push are different refs and do run at once, which is fine as long as
# only one version tag is pushed at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs that publish opt into more below.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck entrypoint.sh test/run_tests.sh test/integration_test.sh

      - name: Run tests
        run: sh test/run_tests.sh

  integration:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t compwire:test .

      - name: Run integration tests
        run: sh test/integration_test.sh compwire:test

  build:
    needs: [test, integration]
    # Only the upstream repo has the credentials, and only refs the tag rules in
    # `push` can actually name are worth pushing digests for. A fork or a
    # workflow_dispatch off a side branch would otherwise push untagged blobs
    # and then fail at manifest creation.
    if: >-
      github.repository == 'ivenos/compwire' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GITHUB_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.GITHUB_IMAGE }},docker.io/${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GITHUB_IMAGE }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}
          # latest=auto keeps `latest` on the newest release proper. A raw latest
          # would also move it for prereleases like v2.0.0-rc1.
          flavor: latest=auto
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Fail loudly if no tag was derived
        # Via env, not interpolated: a ref name may contain shell metacharacters.
        env:
          REF: ${{ github.ref }}
        run: |
          count=$(jq -r '.tags | length' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ "$count" -eq 0 ]; then
            echo "::error::No image tag derived for $REF - refusing to leave untagged digests behind."
            exit 1
          fi

      - name: Create and push multi-arch manifest to GHCR
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io"))) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GITHUB_IMAGE }}@sha256:%s ' *)

      - name: Prepare Docker Hub README
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          printf '**Note:** This description is automatically generated from the [GitHub repository README](https://github.com/ivenos/compwire).\n\n---\n\n' \
            | cat - README.md > /tmp/dockerhub-readme.md
          # Relative links resolve to nothing on Docker Hub. sed has no lookahead,
          # so absolute links and anchors get marked, skipped, and unmarked again.
          sed -i -E \
            -e 's#\]\(http#](@@KEEP@@http#g' \
            -e 's#\]\(\##](@@KEEP@@\##g' \
            -e "s#\]\(([^)@][^)]*)\)#](https://github.com/ivenos/compwire/blob/${GITHUB_REF_NAME}/\1)#g" \
            -e 's#@@KEEP@@##g' \
            /tmp/dockerhub-readme.md

      - name: Create and push multi-arch manifest to Docker Hub
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io") | not)) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'docker.io/${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)

      # Only on a release: the page describes what `latest` is, not what main has.
      - name: Update Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: /tmp/dockerhub-readme.md
