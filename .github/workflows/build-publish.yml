name: Build & Publish

on:
  push:
    branches: [main]
    # Semver only: a tag the rules below cannot name pushes untagged digests.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GITHUB_IMAGE: ghcr.io/ivenos/compwire
  DOCKERHUB_IMAGE: ivenos/compwire

# One run per ref: PRs cancel superseded runs, pushes to the same ref queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs that publish opt into more below.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No job pushes with git, so GITHUB_TOKEN has no business in .git/config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck entrypoint.sh test/run_tests.sh test/integration_test.sh

      - name: Run tests
        run: sh test/run_tests.sh

      - name: Check the compose files parse
        # compose.yml is shipped, not just documentation, and nothing else reads these.
        run: |
          for f in compose.yml examples/*.yaml; do
            echo "$f"
            docker compose -f "$f" config -q
          done

      - name: Run tests under busybox ash
        # The runner's sh is bash, the image's is busybox, and parts of the
        # entrypoint exist because they disagree. Renovate bumps the base image in
        # the Dockerfile and never reads a run: block, so it is taken from there.
        run: |
          base=$(awk '/^FROM /{print $2; exit}' Dockerfile)
          echo "Base image: $base"
          tar c entrypoint.sh Dockerfile test \
            | docker run --rm -i "$base" sh -c 'mkdir /w && cd /w && tar x && sh test/run_tests.sh'

  integration:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t compwire:test .

      - name: Run integration tests
        run: sh test/integration_test.sh compwire:test

  build:
    needs: [test, integration]
    # A fork or a dispatch off a side branch would push untagged blobs and then
    # fail at manifest creation.
    if: >-
      github.repository == 'ivenos/compwire' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Docker meta
        id: meta
        # This job tags nothing, but the labels baked into the image derive from
        # the same rules; without them image.version is the bare ref.
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GITHUB_IMAGE }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=auto
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # GitHub reports BUSL-1.1 as NOASSERTION and that ends up in every image.
          labels: |
            org.opencontainers.image.licenses=BUSL-1.1

      - name: Refuse to push digests that no tag will reference
        # The trigger glob is wider than the semver rules, and the push job only
        # notices once the blobs are in both registries.
        env:
          REF: ${{ github.ref }}
        run: |
          count=$(jq -r '.tags | length' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ "$count" -eq 0 ]; then
            echo "::error::No image tag derived for $REF - refusing to push digests that would never be tagged."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.GITHUB_IMAGE }},docker.io/${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Integration test the image that was pushed
        # The job above tests the source tree, this tests the artifact: neither
        # build pins the apk index. By digest and before any tag.
        env:
          REF: ${{ env.GITHUB_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$REF"
          sh test/integration_test.sh "$REF"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Check that every architecture arrived
        working-directory: /tmp/digests
        # imagetools create exits 0 for a single digest and republishes every tag,
        # latest included, as a single-arch image.
        env:
          EXPECTED: 2
        run: |
          found=$(find . -type f | wc -l)
          if [ "$found" -ne "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED per-architecture digests, found $found - refusing to publish a partial manifest."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GITHUB_IMAGE }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}
          # latest=auto keeps `latest` off prereleases like v2.0.0-rc1.
          flavor: latest=auto
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Fail loudly if no tag was derived
        # Via env, not interpolated: a ref name may contain shell metacharacters.
        env:
          REF: ${{ github.ref }}
        run: |
          count=$(jq -r '.tags | length' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ "$count" -eq 0 ]; then
            echo "::error::No image tag derived for $REF - refusing to leave untagged digests behind."
            exit 1
          fi

      - name: Create and push multi-arch manifest to GHCR
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io"))) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GITHUB_IMAGE }}@sha256:%s ' *)

      - name: Create and push multi-arch manifest to Docker Hub
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io") | not)) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'docker.io/${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)

  # Its own job, after both registries are tagged: in the push job a failure here
  # left GHCR tagged and Docker Hub not, and `docker login` leaves credentials
  # behind for the rest of that job. Only on a release, which the hyphen rules out.
  dockerhub-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: push
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare Docker Hub README
        run: |
          printf '**Note:** This description is automatically generated from the [GitHub repository README](https://github.com/ivenos/compwire).\n\n---\n\n' \
            | cat - README.md > /tmp/dockerhub-readme.md
          # Relative links resolve to nothing on Docker Hub, and sed has no
          # lookahead, so absolute ones are marked, skipped and unmarked again.
          sed -i -E \
            -e 's#\]\(http#](@@KEEP@@http#g' \
            -e 's#\]\(\##](@@KEEP@@\##g' \
            -e "s#\]\(([^)@][^)]*)\)#](https://github.com/ivenos/compwire/blob/${GITHUB_REF_NAME}/\1)#g" \
            -e 's#@@KEEP@@##g' \
            /tmp/dockerhub-readme.md

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: /tmp/dockerhub-readme.md
