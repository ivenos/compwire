name: Build & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and publish, such as v1.5.0
        required: true
        type: string

env:
  GITHUB_IMAGE: ghcr.io/ivenos/compwire
  DOCKERHUB_IMAGE: ivenos/compwire

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Shellcheck
        run: shellcheck entrypoint.sh test/run_tests.sh test/integration_test.sh

      - name: Run tests
        run: sh test/run_tests.sh

      - name: Check the compose files parse
        run: |
          for f in examples/*.yaml; do
            echo "$f"
            docker compose -f "$f" config -q
          done

      - name: Run tests under busybox ash
        # The Dockerfile is the only place Renovate bumps the base image.
        run: |
          base=$(awk '/^FROM /{print $2; exit}' Dockerfile)
          echo "Base image: $base"
          tar c entrypoint.sh Dockerfile test \
            | docker run --rm -i "$base" sh -c 'mkdir /w && cd /w && tar x && sh test/run_tests.sh'

  integration:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Build image
        run: docker build -t compwire:test .

      - name: Run integration tests
        run: sh test/integration_test.sh compwire:test

  build:
    needs: [test, integration]
    if: >-
      github.repository == 'ivenos/compwire' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Read the commit that was checked out
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        # Only the labels are used here; image.version comes from the same rules.
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GITHUB_IMAGE }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=auto
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' && inputs.tag == '' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }}
          # GitHub reports the deprecated GPL-3.0, which leaves -only open.
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      - name: Refuse to push digests that no tag will reference
        env:
          REF: ${{ github.ref }}
        run: |
          count=$(jq -r '.tags | length' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ "$count" -eq 0 ]; then
            echo "::error::No image tag derived for $REF - refusing to push digests that would never be tagged."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.GITHUB_IMAGE }},docker.io/${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          no-cache: ${{ inputs.tag != '' }}

      - name: Integration test the image that was pushed
        env:
          REF: ${{ env.GITHUB_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$REF"
          sh test/integration_test.sh "$REF"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Check that every architecture arrived
        working-directory: /tmp/digests
        # imagetools create accepts a single digest and then publishes every tag single-arch.
        env:
          EXPECTED: 2
        run: |
          found=$(find . -type f | wc -l)
          if [ "$found" -ne "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED per-architecture digests, found $found - refusing to publish a partial manifest."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GITHUB_IMAGE }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=auto
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' && inputs.tag == '' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }}

      - name: Fail loudly if no tag was derived
        env:
          REF: ${{ github.ref }}
        run: |
          count=$(jq -r '.tags | length' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ "$count" -eq 0 ]; then
            echo "::error::No image tag derived for $REF - refusing to leave untagged digests behind."
            exit 1
          fi

      - name: Create and push multi-arch manifest to GHCR
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io"))) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GITHUB_IMAGE }}@sha256:%s ' *)

      - name: Create and push multi-arch manifest to Docker Hub
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io") | not)) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'docker.io/${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)

  # After both registries are tagged, away from the job holding the registry logins.
  dockerhub-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: push
    if: inputs.tag != '' && !contains(inputs.tag, '-')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Prepare Docker Hub README
        env:
          TAG: ${{ inputs.tag }}
        run: |
          printf '**Note:** This description is automatically generated from the [GitHub repository README](https://github.com/ivenos/compwire).\n\n---\n\n' \
            | cat - README.md > /tmp/dockerhub-readme.md
          # Relative links resolve to nothing on Docker Hub, and sed has no
          # lookahead, so absolute ones are marked, skipped and unmarked again.
          sed -i -E \
            -e 's#\]\(http#](@@KEEP@@http#g' \
            -e 's#\]\(\##](@@KEEP@@\##g' \
            -e "s#\]\(([^)@][^)]*)\)#](https://github.com/ivenos/compwire/blob/${TAG}/\1)#g" \
            -e 's#@@KEEP@@##g' \
            /tmp/dockerhub-readme.md

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: /tmp/dockerhub-readme.md
